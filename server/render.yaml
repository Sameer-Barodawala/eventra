services:
  - type: web
    name: eventra-api
    env: node
    plan: free
    buildCommand: npm install && npm run db:init && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
